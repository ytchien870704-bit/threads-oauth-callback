<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Threads 授權回呼</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #111; --muted: #666; --box: #fff; --line: #ddd; --accent: #111; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --box: #1b1b1b; --line: #333; --accent: #eee; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 96px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--box); color: var(--fg); font: 13px/1.5 ui-monospace, Menlo, monospace; word-break: break-all; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg); font-size: 15px; cursor: pointer; }
  .err { color: #d33; }
</style>
</head>
<body>
<main>
  <h1 id="title">Threads 授權回呼</h1>
  <p id="hint">這個頁面只在你的瀏覽器裡顯示授權碼，不會傳送到任何地方。</p>
  <textarea id="code" readonly hidden></textarea>
  <button id="copy" hidden>複製授權碼</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = (q.get('code') || '').replace(/#_?$/, '');
  const title = document.getElementById('title');
  const hint = document.getElementById('hint');
  const box = document.getElementById('code');
  const btn = document.getElementById('copy');
  if (code) {
    title.textContent = '授權成功';
    hint.textContent = '複製下面的授權碼，回到終端機執行 node scripts/stage0/token.ts code 後貼上。授權碼 1 小時內有效、只能用一次。';
    box.value = code; box.hidden = false; btn.hidden = false;
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(code); btn.textContent = '已複製'; }
      catch { box.select(); btn.textContent = '請手動複製（已選取）'; }
    };
    history.replaceState(null, '', location.pathname);
  } else if (q.get('error') || q.get('error_message')) {
    title.textContent = '授權失敗';
    hint.className = 'err';
    hint.textContent = q.get('error_description') || q.get('error_message') || q.get('error');
  }
</script>
</body>
</html>
